name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create a release when a v* tag is pushed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IRacingSmartPlug.csproj

      - name: Publish framework-dependent (small, needs .NET 10 Desktop Runtime)
        run: >
          dotnet publish IRacingSmartPlug.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -o publish/framework

      - name: Publish self-contained (portable, no runtime needed)
        run: >
          dotnet publish IRacingSmartPlug.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish/portable

      - name: Collect both exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/framework/iRacingCompanion.exe dist/iRacingCompanion.exe
          Copy-Item publish/portable/iRacingCompanion.exe dist/iRacingCompanion-portable.exe
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iRacingCompanion-win-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach exes to release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
