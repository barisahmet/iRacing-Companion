name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create a release when a v* tag is pushed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IRacingSmartPlug.csproj

      - name: Publish (win-x64, self-contained single file)
        run: >
          dotnet publish IRacingSmartPlug.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRacingCompanion-win-x64
          path: publish/iRacingCompanion.exe
          if-no-files-found: error

      - name: Attach exe to release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/iRacingCompanion.exe
